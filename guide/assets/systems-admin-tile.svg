<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Systems admin and IT support">
  <defs>
    <linearGradient id="sys-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0f4"/>
      <stop offset="50%" stop-color="#f4f0fa"/>
      <stop offset="100%" stop-color="#fffcf7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sys-bg)"/>

  <!-- Monitor -->
  <rect x="168" y="78" width="304" height="198" rx="16" fill="#fffcf7" stroke="#3a1a6e" stroke-width="3"/>
  <rect x="168" y="78" width="304" height="36" rx="16" fill="#3a1a6e"/>
  <rect x="168" y="98" width="304" height="16" fill="#3a1a6e"/>
  <circle cx="192" cy="96" r="5" fill="#c45c26"/>
  <circle cx="210" cy="96" r="5" fill="#b23a78"/>
  <circle cx="228" cy="96" r="5" fill="#fffcf7" opacity="0.85"/>

  <!-- Screen content: system panels -->
  <rect x="188" y="132" width="110" height="118" rx="10" fill="#3a1a6e" opacity="0.1"/>
  <rect x="200" y="148" width="86" height="10" rx="3" fill="#3a1a6e" opacity="0.55"/>
  <rect x="200" y="170" width="70" height="10" rx="3" fill="#3a1a6e" opacity="0.35"/>
  <rect x="200" y="192" width="78" height="10" rx="3" fill="#c45c26" opacity="0.7"/>
  <rect x="200" y="214" width="60" height="10" rx="3" fill="#3a1a6e" opacity="0.35"/>

  <rect x="314" y="132" width="136" height="52" rx="10" fill="#3a1a6e" opacity="0.12"/>
  <rect x="326" y="146" width="64" height="8" rx="2" fill="#3a1a6e" opacity="0.5"/>
  <rect x="326" y="162" width="92" height="8" rx="2" fill="#3a1a6e" opacity="0.35"/>

  <rect x="314" y="198" width="136" height="52" rx="10" fill="#c45c26" opacity="0.14"/>
  <rect x="326" y="212" width="64" height="8" rx="2" fill="#c45c26" opacity="0.65"/>
  <rect x="326" y="228" width="92" height="8" rx="2" fill="#3a1a6e" opacity="0.35"/>

  <!-- Monitor stand -->
  <rect x="292" y="276" width="56" height="16" rx="4" fill="#3a1a6e"/>
  <rect x="248" y="292" width="144" height="14" rx="6" fill="#3a1a6e" opacity="0.85"/>

  <!-- Gear: IT support -->
  <g transform="translate(468 248)">
    <circle cx="0" cy="0" r="42" fill="#fffcf7" stroke="#3a1a6e" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#c45c26" stroke-width="7"/>
    <g fill="#3a1a6e">
      <rect x="-6" y="-40" width="12" height="18" rx="3"/>
      <rect x="-6" y="22" width="12" height="18" rx="3"/>
      <rect x="-40" y="-6" width="18" height="12" rx="3"/>
      <rect x="22" y="-6" width="18" height="12" rx="3"/>
      <rect x="-32" y="-32" width="14" height="12" rx="3" transform="rotate(-45 -25 -26)"/>
      <rect x="18" y="18" width="14" height="12" rx="3" transform="rotate(-45 25 24)"/>
      <rect x="18" y="-30" width="14" height="12" rx="3" transform="rotate(45 25 -24)"/>
      <rect x="-32" y="18" width="14" height="12" rx="3" transform="rotate(45 -25 24)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#3a1a6e"/>
  </g>

  <!-- Small server stack: left -->
  <g transform="translate(96 248)">
    <rect x="0" y="0" width="58" height="18" rx="5" fill="#3a1a6e"/>
    <rect x="0" y="24" width="58" height="18" rx="5" fill="#4c1d95"/>
    <rect x="0" y="48" width="58" height="18" rx="5" fill="#3a1a6e" opacity="0.85"/>
    <circle cx="14" cy="9" r="3" fill="#c45c26"/>
    <circle cx="14" cy="33" r="3" fill="#b23a78"/>
    <circle cx="14" cy="57" r="3" fill="#fffcf7" opacity="0.9"/>
  </g>
</svg>
